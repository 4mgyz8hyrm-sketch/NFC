<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pages</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');

    :root {
      color-scheme: dark;
      font-family: "DM Sans", sans-serif;
      background: #000;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px;
      background: #000;
    }

    main {
      width: min(1180px, 100%);
      min-height: calc(100vh - 64px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 4px;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.04em;
    }

    header p {
      color: #777;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .previews {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .preview {
      position: relative;
      display: block;
      min-width: 0;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      border: 1px solid #292929;
      background: #101010;
      color: #fff;
      text-decoration: none;
      transition: border-color 180ms ease, transform 180ms ease;
    }

    .preview:hover,
    .preview:focus-visible {
      border-color: #777;
      transform: translateY(-4px);
      outline: none;
    }

    .preview iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      pointer-events: none;
      background: #111;
    }

    .preview-label {
      position: absolute;
      right: 16px;
      bottom: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 15px;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      backdrop-filter: blur(8px);
    }

    .preview-label span:last-child {
      color: #aaa;
      font-size: 1.1rem;
    }

    @media (max-width: 700px) {
      body {
        padding: 18px;
      }

      main {
        min-height: calc(100vh - 36px);
      }

      header {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      .previews {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Choose a page</h1>
      <p>Two small places to visit</p>
    </header>

    <section class="previews" aria-label="Page previews">
      <a class="preview" href="love/" aria-label="Open Love page">
        <iframe src="love/" title="Love page preview" loading="lazy"></iframe>
        <div class="preview-label">
          <span>Love</span>
          <span aria-hidden="true">&#8594;</span>
        </div>
      </a>

      <a class="preview" href="basketball/" aria-label="Open Basketball page">
        <iframe src="basketball/" title="Basketball page preview" loading="lazy"></iframe>
        <div class="preview-label">
          <span>Basketball</span>
          <span aria-hidden="true">&#8594;</span>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
