<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Reminder</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap');

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;

            background:
                linear-gradient(
                    135deg,
                    #f8c8dc 0%,
                    #f7d6df 30%,
                    #d5e9e5 70%,
                    #bde4dc 100%
                );

            font-family: 'Cormorant Garamond', Georgia, serif;
            color: #3f4a49;
        }

        .card {
            width: min(720px, 100%);
            min-height: 380px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 55px 45px;

            background: rgba(255, 255, 255, 0.48);
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 30px;

            box-shadow:
                0 20px 60px rgba(70, 100, 100, 0.15);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            text-align: center;
        }

        .small {
            margin-bottom: 25px;

            font-family: Georgia, serif;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;

            color: rgba(63, 74, 73, 0.6);
        }

        #message {
            margin: 0;

            font-size: clamp(2.2rem, 6vw, 4.2rem);
            font-weight: 500;
            line-height: 1.15;
            letter-spacing: -0.02em;

            text-wrap: balance;
        }

        .heart {
            margin-top: 35px;

            font-family: Georgia, serif;
            font-size: 22px;

            color: rgba(63, 74, 73, 0.45);
        }

        @media (max-width: 500px) {
            body {
                padding: 18px;
            }

            .card {
                min-height: 430px;
                padding: 40px 25px;
                border-radius: 25px;
            }

            .small {
                font-size: 11px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="small">A little reminder</div>

        <h1 id="message">Loading...</h1>

        <div class="heart">♡</div>

    </main>

    <script src="random.js"></script>

</body>
</html>
